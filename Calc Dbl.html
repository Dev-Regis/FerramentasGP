<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17243b">
  <title>Seleção de Linha</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #17243b;
      --bg-2: #213352;
      --menu: rgba(35, 51, 78, 0.88);
      --button: #304766;
      --button-hover: #3a5579;
      --button-click: #47658d;
      --text: #f6f7fb;
      --muted: #aebbd0;
      --border: rgba(255, 255, 255, 0.10);
      --glow: rgba(111, 174, 255, 0.38);
      --shadow: 0 18px 45px rgba(4, 10, 22, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      color: var(--text);
      background:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(145deg, var(--bg), var(--bg-2));
      background-size: 28px 28px, 28px 28px, auto;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(18px);
      opacity: 0.34;
      animation: flutuar 9s ease-in-out infinite alternate;
    }

    body::before {
      top: -95px;
      left: -80px;
      background: radial-gradient(circle, rgba(74, 144, 226, 0.55), transparent 68%);
    }

    body::after {
      right: -90px;
      bottom: -110px;
      background: radial-gradient(circle, rgba(98, 116, 181, 0.46), transparent 68%);
      animation-delay: -4s;
    }

    @keyframes flutuar {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(28px, 22px, 0) scale(1.12);
      }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 355px);
      padding: 15px 13px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--menu);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.055),
        transparent 42%
      );
    }

    .title,
    .subtitle,
    .grid {
      position: relative;
      z-index: 1;
    }

    .title {
      margin-bottom: 4px;
      text-align: center;
      font-size: clamp(1.25rem, 6vw, 1.62rem);
      line-height: 1.15;
    }

    .subtitle {
      margin-bottom: 13px;
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.35;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .line-button {
      position: relative;
      min-height: 45px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: var(--button);
      font: inherit;
      font-size: 0.91rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.14s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .line-button:hover {
      background: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .line-button:focus-visible {
      outline: 2px solid rgba(129, 183, 255, 0.85);
      outline-offset: 2px;
    }

    .line-button.pressed {
      transform: scale(0.965);
      background: var(--button-click);
      box-shadow:
        0 0 0 3px rgba(111, 174, 255, 0.13),
        0 7px 18px rgba(4, 10, 22, 0.25);
    }

    .ripple {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.42);
      transform: translate(-50%, -50%) scale(0);
      animation: ripple 0.52s ease-out forwards;
    }

    @keyframes ripple {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(18);
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 9px;
      }

      .app {
        width: min(100%, 330px);
        padding: 13px 11px;
        border-radius: 17px;
      }

      .title {
        font-size: 1.22rem;
      }

      .subtitle {
        margin-bottom: 11px;
        font-size: 0.71rem;
      }

      .grid {
        gap: 6px;
      }

      .line-button {
        min-height: 42px;
        border-radius: 12px;
        font-size: 0.87rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after {
        animation: none;
      }

      .line-button {
        transition: none;
      }

      .ripple {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1 class="title">Selecione a Linha</h1>
    <p class="subtitle">Escolha uma linha para abrir a ferramenta.</p>

    <section class="grid" aria-label="Linhas de produção">
      <button class="line-button" type="button">Linha 1</button>
      <button class="line-button" type="button">Linha 2</button>
      <button class="line-button" type="button">Linha 3</button>

      <a class="line-button" href="calculadora_dbl.html" aria-label="Abrir ferramenta da Linha 4">
        Linha 4
      </a>

      <button class="line-button" type="button">Linha 5</button>
      <button class="line-button" type="button">Linha 6</button>
    </section>
  </main>

  <script>
    "use strict";

    const buttons = document.querySelectorAll(".line-button");

    buttons.forEach((button) => {
      button.addEventListener("click", (event) => {
        const rect = button.getBoundingClientRect();
        const ripple = document.createElement("span");

        ripple.className = "ripple";
        ripple.style.left = `${event.clientX - rect.left}px`;
        ripple.style.top = `${event.clientY - rect.top}px`;

        button.appendChild(ripple);
        button.classList.add("pressed");

        setTimeout(() => {
          button.classList.remove("pressed");
        }, 180);

        setTimeout(() => {
          ripple.remove();
        }, 550);
      });
    });
  </script>
</body>
</html>
